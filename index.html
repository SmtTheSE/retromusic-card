<audio id="music-player" loop="" src="music.mp3"></audio><script>
document.addEventListener('DOMContentLoaded', () => {
    const audio = document.getElementById('music-player');
    const playPauseBtn = document.querySelector('.w-20.h-20.bg-tertiary');
    const playPauseIcon = playPauseBtn.querySelector('span');

    // Add IDs for easier access
    const progressFill = document.querySelector('.bg-secondary-fixed');
    const currentTimeEl = document.querySelector('.flex.justify-between.font-label-sm span:first-child');
    const durationTimeEl = document.querySelector('.flex.justify-between.font-label-sm span:last-child');
    const progressBar = document.querySelector('.h-6.w-full.border-4');

    // Set initial icon
    playPauseIcon.textContent = 'play_arrow';

    // Format time function
    function formatTime(seconds) {
        if (isNaN(seconds)) return '00:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Load metadata to set duration
    audio.addEventListener('loadedmetadata', () => {
        durationTimeEl.textContent = formatTime(audio.duration);
    });

    // Update progress
    audio.addEventListener('timeupdate', () => {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
    });

    // Click on progress bar to seek
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    });

    playPauseBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            playPauseIcon.textContent = 'pause';
        } else {
            audio.pause();
            playPauseIcon.textContent = 'play_arrow';
        }
    });

    // --- Volume Controls ---
    const volumeDownBtn = document.getElementById('volume-down');
    const volumeUpBtn = document.getElementById('volume-up');
    const volumeBar = document.getElementById('volume-bar');
    const volumeFill = document.getElementById('volume-fill');
    const volumeValue = document.getElementById('volume-value');
    const VOLUME_STEP = 0.1;

    // Start at 80% to match the initial UI
    audio.volume = 0.8;

    function updateVolumeUI() {
        const percent = Math.round(audio.volume * 100);
        volumeFill.style.width = `${percent}%`;
        volumeValue.textContent = `VOL ${percent}%`;
        // Reflect mute state on the down icon for extra feedback
        const downIcon = volumeDownBtn.querySelector('span');
        downIcon.textContent = audio.volume === 0 ? 'volume_off' : 'volume_down';
    }

    function setVolume(value) {
        // Clamp between 0 and 1
        audio.volume = Math.min(1, Math.max(0, value));
        updateVolumeUI();
    }

    volumeDownBtn.addEventListener('click', () => {
        // Round to avoid floating point drift (e.g. 0.30000000000004)
        setVolume(Math.round((audio.volume - VOLUME_STEP) * 10) / 10);
    });

    volumeUpBtn.addEventListener('click', () => {
        setVolume(Math.round((audio.volume + VOLUME_STEP) * 10) / 10);
    });

    // Click / drag on the volume meter to set volume directly
    function setVolumeFromEvent(e) {
        const rect = volumeBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        setVolume(pos);
    }

    let draggingVolume = false;
    volumeBar.addEventListener('mousedown', (e) => {
        draggingVolume = true;
        setVolumeFromEvent(e);
    });
    document.addEventListener('mousemove', (e) => {
        if (draggingVolume) setVolumeFromEvent(e);
    });
    document.addEventListener('mouseup', () => {
        draggingVolume = false;
    });

    // Keyboard shortcuts: Arrow Up / Down adjust volume
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            setVolume(Math.round((audio.volume + VOLUME_STEP) * 10) / 10);
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setVolume(Math.round((audio.volume - VOLUME_STEP) * 10) / 10);
        }
    });

    updateVolumeUI();
});
</script></body></html>
